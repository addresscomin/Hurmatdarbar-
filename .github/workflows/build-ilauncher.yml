name: Build iLauncher APK
on:
  push:
    paths:
      - 'iLauncher.zip'
      - '.github/workflows/build-ilauncher.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract original project
        run: |
          unzip -q iLauncher.zip
          test -f iLauncher/app/build.gradle.kts
      - name: Build debug APK
        working-directory: iLauncher
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iLauncher-debug-apk
          path: iLauncher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
